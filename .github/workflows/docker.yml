name: Docker Build & Push

on:
  push:
    branches: [memory-fix]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build graphql-engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/binary64/graphql-engine:latest
            ghcr.io/binary64/graphql-engine:memory-fix
            ghcr.io/binary64/graphql-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
