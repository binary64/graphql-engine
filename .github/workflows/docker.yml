name: Docker Build & Push

on:
  push:
    branches: [memory-fix, remote-schema-local-file]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build graphql-engine
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcrunner /opt/hostedtoolcache
          sudo docker rmi $(docker image ls -aq) 2>/dev/null || true
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/binary64/graphql-engine:${{ github.ref_name }}
            ghcr.io/binary64/graphql-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
